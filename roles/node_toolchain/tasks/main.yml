---
- name: Add the NodeSource apt repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: [deb]
    uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
    suites: [nodistro]
    components: [main]
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    update_cache: true
    state: present

- name: Read installed npm and pnpm major versions
  ansible.builtin.shell: |
    set -o pipefail
    echo "npm=$(npm --version 2>/dev/null | cut -d. -f1)"
    echo "pnpm=$(pnpm --version 2>/dev/null | cut -d. -f1)"
  args:
    executable: /bin/bash
  register: node_toolchain_pm_versions
  changed_when: false

- name: Install pinned npm and pnpm majors (no install scripts)
  ansible.builtin.command: >-
    npm install -g --ignore-scripts
    npm@{{ npm_version }} pnpm@{{ pnpm_version }}
  when: >-
    ('npm=' ~ npm_version) not in node_toolchain_pm_versions.stdout_lines or
    ('pnpm=' ~ pnpm_version) not in node_toolchain_pm_versions.stdout_lines
  changed_when: true

- name: Write the dev user's npm config
  ansible.builtin.template:
    src: npmrc.j2
    dest: "/home/{{ dev_user }}/.npmrc"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"

- name: Create the pnpm config directory
  ansible.builtin.file:
    path: "/home/{{ dev_user }}/.config/pnpm"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0700"

- name: Write the dev user's pnpm config
  ansible.builtin.template:
    src: pnpm-config.yaml.j2
    dest: "/home/{{ dev_user }}/.config/pnpm/config.yaml"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"
