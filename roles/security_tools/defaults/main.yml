  x86_64: 5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91
  aarch64: 74f2f5c6024d397481db228db8fc25eed420db192243f88438c118e7e013e585

# Semgrep comes from PyPI. uv resolves it and its dependencies with
# --exclude-newer, so nothing published in the last N days is installed.
security_tools_semgrep_version: "1.185.0"         # released 2026-11-10
security_tools_python_release_age_days: 3

# SkillSpector is not on PyPI. It is installed from a pinned commit, and
# its dependencies come from the project's own uv.lock (hash-checked).
security_tools_skillspector_version: v2.13.4      # tagged 2026-11-05
security_tools_skillspector_commit: 54824463814a0be01360792523ec7245a69190fc

# Scan staged files for secrets on every commit.
security_tools_secret_scan_hook: true
