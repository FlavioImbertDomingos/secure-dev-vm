# Every tool is pinned to a version that was at least 3 days old when it
# was picked, and every download is checked against a SHA-256 recorded
# here. A release that gets swapped or re-tagged later fails the install
# instead of running. To upgrade: pick a release older than 3 days, copy
# its checksums from the release page, update both values, rerun.
#
# Picked on 2026-11-16.

security_tools_dir: /opt/devbox-tools

